# ── Warm start (n0=100), candidate opt, reference noise (Makarova et al.) ──
#    Compares four algorithms:
#      gpucb            : GP,          GP-UCB     (sigma_n^2)
#      gpucb_pv         : GP,          GP-UCB-PV  (sigma_n^2 + rho)
#      gpucb_tabpfn_clt : TabPFN-CLT,  GP-UCB     (V_bar_n / n)
#      gpucb_pv_tabpfn  : TabPFN-PPD,  GP-UCB-PV  (PPD variance, which is
#                         already the total sigma_n^2 + rho; rho not added)
#    Same fairness settings as warm200_candidate_reference_tabpfn_clt_fair_beta2
#    (standardised y for the GP, seed-dependent grid, random ties, beta = 2).
experiment:
  name: "warm100"
  n_iter: 30
start:
  type: "warm"
  n_init: 100
surrogate:
  output_scale: 1.0
  lengthscale: 1.0
  prior_mean: 0.0
  prior_var: 1.0
  standardize_y: true  # GP prior applied on unit scale (Branin reaches ~ -300)
tabpfn_clt:
  n_estimators: 16    # TabPFN ensemble members per forward pass
  n_perms: 1         # original data order only
  start_k: 3         # K1: CLT sum starts here (>= 3), no g_0 needed
tabpfn_ppd:
  n_estimators: 16    # same ensemble size as the CLT surrogate
optimization:
  method: "candidate"
  n_candidates: 2000
  seed_grid: true      # candidate set depends on the trial seed
  random_ties: true    # break exact acquisition ties at random
noise:
  source: "reference"
beta:
  type: "constant"   # same beta_n = 2.0 at every iteration, all algorithms
  value: 2.0
benchmarks: ["sine", "branin"]
noise_types: ["hetero"]
algorithms: ["gpucb", "gpucb_pv", "gpucb_tabpfn_clt", "gpucb_pv_tabpfn"]
seeds: [0, 1, 2, 3, 4]
