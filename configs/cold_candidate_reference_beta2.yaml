# ── Config 4: Cold start, candidate, reference noise, beta=2, fixed hypers ─
experiment:
  name: "cold_candidate_reference_beta2"
  n_iter: 50
start:
  type: "cold"
surrogate:
  learn_hyperparams: false    # fixed hyperparameters (default)
  output_scale: 0.5           # sigma_f^2
  lengthscale: 0.5            # ell
  noise_var: 0.1              # likelihood noise
  prior_mean: 0.0
  prior_var: 1.0
optimization:
  method: "candidate"
  n_candidates: 2000
noise:
  source: "reference"
beta:
  type: "constant"
  value: 2.0
benchmarks: ["sine", "branin"]
noise_types: ["hetero"]
algorithms: ["gpucb", "gpucb_pv"]
seeds: [0, 1, 2, 3, 4]