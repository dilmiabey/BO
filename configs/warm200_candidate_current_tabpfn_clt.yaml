# ── Warm start (n0=200), candidate opt, current noise ──
#    Compares GP-UCB, GP-UCB-PV, and GP-UCB with TabPFN-CLT uncertainty.
experiment:
  name: "warm200_candidate_current_tabpfn_clt"
  n_iter: 50
start:
  type: "warm"
  n_init: 200
surrogate:
  output_scale: 1.0
  lengthscale: 1.0
  prior_mean: 0.0
  prior_var: 1.0
optimization:
  method: "candidate"
  n_candidates: 2000
noise:
  source: "current"
beta:
  type: "srinivas"
  delta: 0.1
benchmarks: ["sine", "branin"]
noise_types: ["hetero"]
algorithms: ["gpucb", "gpucb_pv", "gpucb_tabpfn_clt"]
seeds: [0, 1, 2, 3, 4]