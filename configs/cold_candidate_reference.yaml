# ── Config 3: Cold start, candidate optimisation, reference noise ──────────
# Reference: Makarova, Usmanova, Bogunovic, Krause (NeurIPS 2021)
# Heteroscedastic only.
experiment:
  name: "cold_candidate_reference"
  n_iter: 50
start:
  type: "cold"
surrogate:
  output_scale: 1.0
  lengthscale: 1.0
  prior_mean: 0.0
  prior_var: 1.0
optimization:
  method: "candidate"
  n_candidates: 2000
noise:
  source: "reference"
beta:
  type: "srinivas"
  delta: 0.1
benchmarks: ["sine", "branin"]
noise_types: ["hetero"]
algorithms: ["gpucb", "gpucb_pv"]
seeds: [0, 1, 2, 3, 4]